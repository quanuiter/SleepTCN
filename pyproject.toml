[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeptcn"
version = "0.1.0"
description = "Reproducible Sleep-EDF Expanded experiments for 15CNN, ResNet-1D, BiLSTM and TCN"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "matplotlib==3.9.1; platform_system != 'Windows'",
    "matplotlib==3.9.2; platform_system == 'Windows'",
    "pyedflib==0.1.38",
    "PyYAML==6.0.1",
    "torch==2.5.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.2"]
demo = ["streamlit==1.62.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
