[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeptcn"
version = "0.1.0"
description = "Reproducible Sleep-EDF Expanded experiments for 15CNN, ResNet-1D, BiLSTM and TCN"
requires-python = ">=3.10,<3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

